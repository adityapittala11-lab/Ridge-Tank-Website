<!doctype html><html><head><meta charset="utf-8"><title>Ridge Tank – meeting poster</title><link rel="stylesheet" href="base.css"><style>
.art{width:1080px;height:1350px;padding:80px}
.top{position:relative;display:flex;justify-content:space-between;align-items:center}
.top .mark{width:72px;height:72px}
.top .mono{font-size:22px;color:var(--ink-3)}
.body{position:relative;margin-top:150px}
.eyebrow{font-size:26px;color:var(--g-300);display:flex;align-items:center;gap:16px}
.eyebrow:before{content:"";width:56px;height:2px;background:var(--g-400)}
h1{font:800 210px/.92 var(--display);letter-spacing:-.045em;margin-top:34px}
h1 span{display:block;background:linear-gradient(90deg,var(--g-300),var(--g-400) 50%,var(--b-400));-webkit-background-clip:text;background-clip:text;color:transparent}
.date{position:relative;margin-top:70px;display:flex;align-items:stretch;gap:36px}
.tile{width:210px;border:1px solid var(--line);background:rgba(255,255,255,.05);backdrop-filter:blur(10px);display:flex;flex-direction:column}
.tile b{background:var(--b-500);font:600 30px/1 var(--mono);letter-spacing:.2em;text-align:center;padding:16px 0}
.tile em{font:800 130px/1 var(--display);font-style:normal;text-align:center;padding:14px 0 22px}
.info{display:flex;flex-direction:column;justify-content:center;gap:14px}
.info .day{font:700 66px/1 var(--display);letter-spacing:-.02em}
.info .sub{font-size:32px;color:var(--ink-2);line-height:1.35;max-width:520px}
.foot{position:absolute;left:80px;right:80px;bottom:80px;display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid var(--line);padding-top:34px}
.foot .tag{font:700 44px/1.1 var(--display);letter-spacing:-.01em}
.foot .tag i{font-style:normal;color:var(--g-300)}
.foot .url{font:500 24px/1.4 var(--mono);color:var(--ink-3);text-align:right}
.foot .url b{color:var(--ink);font-weight:500}
</style></head><body><div class="art">
<div class="mesh"><i style="width:900px;height:900px;left:-300px;top:-200px;background:#0d6b44;opacity:.75"></i><i style="width:800px;height:800px;right:-300px;bottom:-150px;background:var(--b-600);opacity:.8"></i><i style="width:500px;height:500px;left:300px;top:620px;background:#041a10;opacity:.9"></i></div><div class="grain"></div>
<div class="top"><div class="brand"><span class="mark" style="width:72px;height:72px"><svg viewBox="0 0 24 24"><path d="M2.5 18.5c3.4-.7 6.4-3.2 8.2-7.4.9-2.2 1.4-4.6 1.6-7.1 3.2 3.9 6.1 9.2 9.2 14.5"/><path d="M2.5 18.5h19"/></svg></span>Ridge Tank</div><div class="mono">Mountain Ridge High School</div></div>
<div class="body"><div class="eyebrow mono">Next meeting</div><h1>See you<span>Oct 21.</span></h1></div>
<div class="date"><div class="tile"><b>OCT</b><em>21</em></div><div class="info"><div class="day">Wednesday</div><div class="sub">Get your Ridge Tank card, see what we're building this year, and start climbing the leaderboard.</div></div></div>
<div class="foot"><div class="tag">Tap in. Pitch. <i>Climb.</i></div><div class="url">Sign up first at<br><b>ridge-tank-website.vercel.app</b></div></div>
</div></body></html>
