<!doctype html><html><head><meta charset="utf-8"><title>Ridge Tank – 100 Bites note (back)</title><link rel="stylesheet" href="base.css"><style>
.art{width:1800px;height:750px;padding:54px 66px;border:10px solid var(--b-700)}
.frame{position:absolute;inset:26px;border:2px solid rgba(240,154,178,.35)}
.mesh{filter:blur(60px)}
.c{position:relative;height:100%;display:grid;grid-template-columns:1fr 520px;gap:70px;align-items:center}
.left h2{font:800 104px/.95 var(--display);letter-spacing:-.04em}
.left h2 span{display:block;background:linear-gradient(90deg,var(--g-300),var(--g-400) 50%,var(--b-400));-webkit-background-clip:text;background-clip:text;color:transparent}
.left p{margin-top:26px;font-size:30px;line-height:1.4;color:var(--ink-2);max-width:760px}
.steps{display:flex;gap:40px;margin-top:40px;font:500 22px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--g-300)}
.steps em{font-style:normal;color:var(--ink-3)}
.right{text-align:center}
.tiers{position:relative}
.track{height:4px;background:linear-gradient(90deg,var(--g-300),var(--g-400) 45%,#f2efe8 70%,var(--b-400));margin:0 12px}
.nodes{display:flex;justify-content:space-between;margin-top:-14px}
.nodes div{width:26px;height:26px;background:var(--bg);border:4px solid;box-shadow:0 0 24px -2px currentColor}
.names{display:flex;justify-content:space-between;margin-top:26px;font:600 21px/1.2 var(--display);text-align:center}
.mark{width:190px;height:190px;margin:0 auto 46px}
.tag{margin-top:50px;font:500 20px/1.5 var(--mono);letter-spacing:.22em;color:var(--ink-3);text-transform:uppercase}
.mark svg{}
.foot{position:absolute;left:66px;right:66px;bottom:44px;display:flex;justify-content:space-between;font:500 20px/1 var(--mono);letter-spacing:.18em;color:var(--ink-3)}
</style></head><body><div class="art">
<div class="mesh"><i style="width:800px;height:800px;right:-200px;top:-300px;background:var(--b-600);opacity:.8"></i><i style="width:800px;height:800px;left:-250px;bottom:-350px;background:#0d6b44;opacity:.75"></i></div><div class="grain"></div><div class="frame"></div>
<div class="c"><div class="left"><h2>Invest it<span>or lose it.</span></h2>
<p>Back the pitches you believe in. First place pays 3x, second 2x, third 1.5x. Unspent Bites fade 10% every month.</p>
<div class="steps"><div><em>01</em><br>Tap in</div><div><em>02</em><br>Invest</div><div><em>03</em><br>Climb</div></div></div>
<div class="right"><div class="mark"><svg viewBox="0 0 24 24"><path d="M2.5 18.5c3.4-.7 6.4-3.2 8.2-7.4.9-2.2 1.4-4.6 1.6-7.1 3.2 3.9 6.1 9.2 9.2 14.5"/><path d="M2.5 18.5h19"/></svg></div>
<div class="tiers"><div class="track"></div><div class="nodes"><div style="color:var(--g-300)"></div><div style="color:var(--g-400)"></div><div style="color:#f2efe8"></div><div style="color:var(--b-400)"></div></div>
<div class="names"><span>Reef<br>Shark</span><span>Tiger<br>Shark</span><span>Great<br>White</span><span style="color:var(--b-200)">Mega-<br>lodon</span></div></div></div></div>
<div class="foot"><span>RIDGE TANK</span><span>THE TANK MARKET</span><span>100 BITES</span></div>
</div></body></html>
