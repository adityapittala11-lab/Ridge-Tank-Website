<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ridge Tank</title>
  <meta name="description" content="Ridge Tank, Mountain Ridge High School's Shark Tank program. Tap in at meetings, pitch, earn badges, and climb the members-only leaderboard.">
  <meta name="theme-color" content="#030705">
  <!-- The site is already dark; stop dark-mode extensions (e.g. Dark Reader) from repainting it. -->

  <script>try{var t=localStorage.getItem("rt_theme");if(t==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
  <meta name="darkreader-lock">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

    <div class="intro-caption" aria-hidden="true">Mountain Ridge High School</div>

  <main id="app" tabindex="-1"></main>

  <nav id="bottombar" aria-label="Main navigation"></nav>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>

    <p style="position:relative;z-index:5;padding:120px 24px;text-align:center">Ridge Tank needs JavaScript turned on.</p>
