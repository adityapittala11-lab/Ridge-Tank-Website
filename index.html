      <h1>Ridge Tank</h1>
      <p>Ridge Tank is the student-run startup program at Mountain Ridge High School in Glendale, Arizona. Students pitch real ideas, get judged by student Sharks, and build real businesses. It runs with the school's FBLA chapter and is free to join.</p>
      <p>Meeting two (Thu Nov 19, 2026): 60+ student innovators, up from 40 at meeting one. Shark Tank founder Sabin Lomac spoke by video for 10 minutes. He co-founded Cousins Maine Lobster, which got a $55,000 deal from Barbara Corcoran on Shark Tank in 2012 and has passed $1 billion in sales. Teams pitched real ideas to student Sharks, and the top three won $60+ in prizes.</p>
      <p>Next meeting: December 2026 (date to be announced). Demo Day: Feb 10, 2027. Grand Finale: May 12, 2027.</p>
      <p>Sponsors: Sylvan Learning, Lund Mortgage Team and Ramsey Auto Center.</p>
      <p><a href="/about.html" style="color:#6fe0a8">Read the full Ridge Tank overview</a> &middot; <a href="mailto:ridgetank.club@gmail.com" style="color:#6fe0a8">ridgetank.club@gmail.com</a></p>
