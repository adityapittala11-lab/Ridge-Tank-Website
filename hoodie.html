<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Ridge Tank hoodie</title>
  <meta name="description" content="60 student founders. One hoodie. Your name on the back.">
  <meta property="og:title" content="The Ridge Tank hoodie">
  <meta property="og:description" content="60 student founders. One hoodie. Your name on the back.">
  <meta property="og:image" content="https://www.ridgetank.com/marketing/hoodie-back.jpg">
  <meta name="color-scheme" content="dark">
  <style>
    :root { --bg: #0E402C; --ink: #F2ECE0; --mint: #6FE0A8; --burg: #7A1434; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 Arial, Helvetica, sans-serif; }
    main { width: min(920px, calc(100% - 32px)); margin: 0 auto; padding: 40px 0 56px; text-align: center; }
    .tag { color: var(--mint); letter-spacing: 2px; font-size: 13px; font-weight: bold; text-transform: uppercase; }
    h1 { font-size: clamp(30px, 6vw, 48px); line-height: 1.1; margin: 10px 0 8px; }
    p { margin: 0 auto 24px; max-width: 560px; color: rgba(242, 236, 224, 0.85); }
    .row { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
    .row img { width: min(440px, 100%); height: auto; display: block; }
    .btn { display: inline-block; margin-top: 28px; background: var(--burg); color: #fff; text-decoration: none; font-weight: bold; padding: 13px 26px; }
  </style>
</head>
<body>
<main>
  <div class="tag">Ridge Tank &middot; Mountain Ridge High School</div>
  <h1>The Ridge Tank hoodie</h1>
  <p>60 student founders will wear this at school, at ICDC, and all over town. Sponsor names go on the back.</p>
  <div class="row">
    <img src="/marketing/hoodie-front.jpg" alt="Ridge Tank hoodie, front">
    <img src="/marketing/hoodie-back.jpg" alt="Ridge Tank hoodie, back, powered by your brand">
  </div>
  <a class="btn" href="/#/sponsor">Save my spot</a>
</main>
</body>
</html>
