<title>NQ Trade Replay</title>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: strategy picker + stats, equity strip, trade chart styled like a TradingView replay (3 Supertrend lines with shaded zones, flag labels, position box, replay toolbar), detail strip and a windowed trade list. */
:root {
  --bg: #eceff5; --panel: #ffffff; --ink: #111827; --mute: #5d6678; --line: #d9deea; --chip: #e6eaf3;
  --bull: #2563eb; --bear: #ea580c; --profit: #7c3aed; --risk: #d97706; --ema: #0e9f8e;
  --win: #0f9d6e; --loss: #e11d48; --tag: #111827; --tagfg: #ffffff;
  --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0e18; --panel: #121827; --ink: #e8ecf6; --mute: #8d97ad; --line: #232c40; --chip: #1a2236;
    --bull: #4f9bff; --bear: #ff8a50; --profit: #9b7bff; --risk: #f5b13d; --ema: #2fd3bd;
    --win: #3ddc97; --loss: #ff5c7a; --tag: #e8ecf6; --tagfg: #0a0e18; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0e18; --panel: #121827; --ink: #e8ecf6; --mute: #8d97ad; --line: #232c40; --chip: #1a2236;
  --bull: #4f9bff; --bear: #ff8a50; --profit: #9b7bff; --risk: #f5b13d; --ema: #2fd3bd;
  --win: #3ddc97; --loss: #ff5c7a; --tag: #e8ecf6; --tagfg: #0a0e18; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45;
  padding-block: 20px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--mute); margin: 2px 0 0; max-width: 90ch; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.win { color: var(--win); } .loss { color: var(--loss); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.top { display: flex; gap: 14px; flex-wrap: wrap; align-items: stretch; }
.strats { display: flex; flex-direction: column; gap: 8px; flex: 1 1 340px; min-width: 0; }
.strat { text-align: left; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; background: var(--panel); }
.strat b { font-weight: 600; }
.strat span { color: var(--mute); font-size: 12.5px; }
.strat[aria-pressed="true"] { border-color: var(--bull); box-shadow: inset 3px 0 0 var(--bull); }
.stats { flex: 2 1 520px; display: flex; flex-wrap: wrap; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; align-self: stretch; min-width: 0; }
.stat { background: var(--panel); padding: 10px 12px; min-width: 0; flex: 1 1 118px; }
.stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--mute); }
.stat .v { font-family: var(--mono); font-size: 18px; font-weight: 500; margin-top: 2px; }
button { font: inherit; color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 6px 11px; cursor: pointer; }
button:hover { border-color: var(--mute); }
button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.strat[aria-pressed="true"] { background: var(--panel); color: var(--ink); border-color: var(--bull); }
.strat[aria-pressed="true"] span { color: var(--mute); }
button:focus-visible, canvas:focus-visible, .row:focus-visible { outline: 2px solid var(--bull); outline-offset: 2px; }
.eq { padding: 10px 12px 8px; }
.eq .cap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--mute); margin-bottom: 4px; }
canvas { display: block; width: 100%; }
#eqc { height: 84px; cursor: pointer; }
.bar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.nav { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.nav .pl { font-family: var(--mono); font-size: 13px; padding: 0 6px; min-width: 10ch; text-align: center; }
.main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
@media (min-width: 1040px) { .main { grid-template-columns: minmax(0, 1fr) 300px; } }
.chartbox { padding: 10px 10px 0; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.head .title { font-weight: 600; font-size: 15px; }
.badge { font-family: var(--mono); font-size: 12px; padding: 2px 8px; border-radius: 4px; border: 1px solid currentColor; }
.hover { font-family: var(--mono); font-size: 12px; color: var(--mute); min-height: 18px; overflow-wrap: anywhere; }
.stage { position: relative; }
#chart { height: 480px; cursor: crosshair; touch-action: pan-y; }
@media (max-width: 640px) { #chart { height: 340px; } }
.tools { position: absolute; left: 8px; bottom: 34px; display: flex; gap: 6px; }
.tools button { width: 34px; height: 30px; padding: 0; background: var(--tag); color: var(--tagfg); border-color: var(--tag); opacity: 0.88; font-weight: 700; }
.tools button:hover { opacity: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--mute); padding: 0 2px 8px; }
.legend i { display: inline-block; width: 16px; height: 8px; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
.detail { display: flex; flex-wrap: wrap; gap: 1px; background: var(--line); border-top: 1px solid var(--line); margin: 0 -10px; }
.detail > div { padding: 8px 12px; min-width: 0; flex: 1 1 130px; background: var(--panel); }
.detail .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--mute); }
.detail .v { font-family: var(--mono); font-size: 13px; margin-top: 1px; overflow-wrap: anywhere; }
.list { display: flex; flex-direction: column; max-height: 720px; min-height: 0; }
.list .lh { padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--mute); }
.rows { overflow-y: auto; flex: 1; position: relative; }
.row { display: grid; grid-template-columns: 46px 1fr 20px 56px; gap: 6px; white-space: nowrap; padding: 6px 12px; border-bottom: 1px solid var(--line); cursor: pointer; font-family: var(--mono); font-size: 12px; align-items: center; }
.row:hover { background: var(--chip); }
.row[aria-current="true"] { background: var(--chip); box-shadow: inset 3px 0 0 var(--bull); }
.row .r { text-align: right; }
.note { color: var(--mute); font-size: 12px; max-width: 120ch; }
.msg { padding: 24px; color: var(--mute); }
</style>

<div class="wrap">
  <header>
    <h1>NQ Trade Replay</h1>
    <p class="sub" id="sub"></p>
  </header>
  <div class="top">
    <div class="strats" id="strats" role="group" aria-label="Strategy"></div>
    <section class="stats" id="stats" aria-label="Summary"></section>
  </div>
  <section class="panel eq" aria-label="Equity curve">
    <div class="cap"><span id="eqcap"></span><span id="eqnote" class="mono"></span></div>
    <canvas id="eqc" aria-label="Account balance after each trade"></canvas>
  </section>
  <div class="bar">
    <div class="chips" id="chips" role="group" aria-label="Filter trades"></div>
    <div class="nav">
      <button id="first" title="First trade (Home)">First</button>
      <button id="prev" title="Previous trade (Left arrow)">Prev</button>
      <span class="pl" id="poslab"></span>
      <button id="next" title="Next trade (Right arrow)">Next</button>
      <button id="last" title="Last trade (End)">Last</button>
      <button id="rand" title="Random trade">Random</button>
    </div>
  </div>
  <div class="main">
    <section class="panel chartbox" aria-label="Selected trade">
      <div class="head"><span class="title" id="ttl"></span><span class="badge" id="badge"></span></div>
      <div class="hover" id="hover">Move over the chart to read each candle.</div>
      <div class="stage">
        <canvas id="chart" tabindex="0" aria-label="Candlestick chart of the selected trade"></canvas>
        <div class="tools">
          <button id="zin" title="Zoom in" aria-label="Zoom in">+</button>
          <button id="zout" title="Zoom out" aria-label="Zoom out">&minus;</button>
          <button id="tprev" title="Previous trade" aria-label="Previous trade">&lsaquo;</button>
          <button id="tnext" title="Next trade" aria-label="Next trade">&rsaquo;</button>
          <button id="zrst" title="Reset zoom" aria-label="Reset zoom">&#8635;</button>
        </div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="detail" id="detail"></div>
    </section>
    <aside class="panel list" aria-label="Trade list">
      <div class="lh" id="lh"></div>
      <div class="rows" id="rows"></div>
    </aside>
  </div>
  <p class="note" id="note"></p>
</div>

async function decode() {
  const bin = Uint8Array.from(atob(BLOB), c => c.charCodeAt(0));
  const ab = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  const all = new Int32Array(ab); let off = 0; const sec = {};
  for (const [name, len] of META.sections) { sec[name] = all.subarray(off, off + len); off += len; }
  const un = (a, scale) => { const o = new Float64Array(a.length); let v = 0; for (let i = 0; i < a.length; i++) { v += a[i]; o[i] = v / scale; } return o; };
  B = { n: META.n, t: un(sec.t, 1), o: un(sec.o, 100), h: un(sec.h, 100), l: un(sec.l, 100), c: un(sec.c, 100), e: un(sec.e, 100),
        line: [0, 1, 2].map(k => un(sec['ln' + k], 100)), dir: sec.dirs };
  B.t = B.t.map(x => x * 60);
  S = META.strats.map((s, k) => {
    const g = n => sec[`s${k}_${n}`], m = g('ei').length, tr = [];
    let bal = META.capital;
    for (let i = 0; i < m; i++) {
      const pnl = g('pnl')[i]; bal += pnl;
      tr.push({ id: i + 1, ei: g('ei')[i], xi: g('xi')[i], side: g('side')[i], entry: g('en')[i] / 100, exit: g('ex')[i] / 100, pnl, bal,
                sl: g('sl')[i] / 100, tp: g('tp')[i] / 100, why: g('why')[i], test: g('ei')[i] >= META.testStart });
    }
    return { ...s, trades: tr };
  });
}
const dirOf = (i, k) => { const c = B.dir[i]; return (Math.floor(c / [1, 3, 9][k]) % 3) - 1; };

function curTrades() { return S[sIdx].trades.filter(t => periodKey === 'all' || t.test); }

function renderStats() {
  const tr = curTrades(); const w = tr.filter(t => t.pnl > 0), l = tr.filter(t => t.pnl <= 0);
  const gw = w.reduce((a, t) => a + t.pnl, 0), gl = Math.abs(l.reduce((a, t) => a + t.pnl, 0));

  const net = tr.reduce((a, t) => a + t.pnl, 0);
  const items = [['Trades', tr.length.toLocaleString(), ''], ['Win rate', tr.length ? (100 * w.length / tr.length).toFixed(1) + '%' : '-', ''],
    ['Net P&L', fmt$(net), net >= 0 ? 'win' : 'loss'], ['Profit factor', gl ? (gw / gl).toFixed(2) : '-', ''],
    ['Avg win', w.length ? fmt$(gw / w.length) : '-', 'win'], ['Avg loss', l.length ? fmt$(-gl / l.length) : '-', 'loss'], ['Max drawdown', fmt$(dd), 'loss']];

    '<span style="width:8px"></span>' + FILTERS.map(([k, l, f]) => `<button data-k="${k}" aria-pressed="${k === fkey}">${l} <span class="mono">${base.filter(f).length.toLocaleString()}</span></button>`).join('');
}
function refilter(keepId) {
  const f = FILTERS.find(x => x[0] === fkey)[2];
  filtered = curTrades().filter(f);
  let i = 0;
  if (keepId != null) { i = filtered.findIndex(t => t.id >= keepId); if (i < 0) i = filtered.length - 1; }
  cur = Math.max(0, i); renderStats(); renderChips(); resetSpan(); update();
}
function go(i) { cur = Math.min(filtered.length - 1, Math.max(0, i)); resetSpan(); update(); }
function resetSpan() { const t = filtered[cur]; if (!t) return; spanBase = Math.max(70, (t.xi - t.ei) + 70); span = spanBase; }

/* ---------- detail / list ---------- */
function update() {
  const t = filtered[cur];
  if (!t) { $('ttl').textContent = 'No trades in this selection'; return; }
  $('poslab').textContent = `${cur + 1} / ${filtered.length.toLocaleString()}`;
  $('ttl').textContent = `Trade #${t.id} · ${t.side === 1 ? 'Long' : 'Short'} · ${nyf.format(T(t.ei))}${t.test ? ' · test period' : ''}`;
  const b = $('badge'); b.textContent = WHY[t.why] + ' ' + fmt$(t.pnl); b.style.color = t.pnl > 0 ? 'var(--win)' : 'var(--loss)';
  const held = (t.xi - t.ei + 1) * 5, hh = held >= 120 ? (held / 60).toFixed(1) + ' h' : held + ' min';
  const risk = t.sl ? Math.abs(t.entry - t.sl) : 0, pts = (t.exit - t.entry) * t.side;
  const cells = [['Entry', t.entry.toFixed(2)], ['Exit', t.exit.toFixed(2)], ['Stop', t.sl ? t.sl.toFixed(2) : 'none'], ['Target', t.tp ? t.tp.toFixed(2) : 'none'],
    ['Points', (pts >= 0 ? '+' : '') + pts.toFixed(2)], ['Net P&L', fmt$(t.pnl)], ['R multiple', risk ? (pts / risk).toFixed(2) + 'R' : '-'],
    ['Held', hh], ['Exited', nyf.format(T(t.xi))], ['Balance', fmtBal(META.capital + (t.bal - META.capital))]];
  $('detail').innerHTML = cells.map(([k, v]) => `<div><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
  renderList(); draw(); drawEq();
}
function renderList() {
  const a = Math.max(0, cur - 40), z = Math.min(filtered.length, cur + 60);
  $('lh').textContent = `Showing ${a + 1} to ${z} of ${filtered.length.toLocaleString()}`;
  let h = '';
  for (let i = a; i < z; i++) { const t = filtered[i];
    h += `<div class="row" role="button" tabindex="0" data-i="${i}" ${i === cur ? 'aria-current="true"' : ''}><span>#${t.id}</span><span>${nyf.format(T(t.ei))}</span><span>${t.side === 1 ? 'L' : 'S'}</span><span class="r ${t.pnl > 0 ? 'win' : 'loss'}">${fmt$(t.pnl)}</span></div>`; }
  $('rows').innerHTML = h;
  const el = $('rows').querySelector('[aria-current]'); if (el) $('rows').scrollTop = el.offsetTop - $('rows').clientHeight / 2 + 16;

/* ---------- canvas helpers ---------- */
function setup(cv) {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h); return [c, w, h];
}
const rrect = (c, x, y, w, h, r) => { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };

/* ---------- main chart ---------- */
function draw() {
  const t = filtered[cur]; if (!t || !B) return;
  const [c, W, H] = setup($('chart'));
  const padL = 6, padR = 66, padT = 16, padB = 26;
  const mid = Math.round((t.ei + t.xi) / 2);
  let a = Math.round(mid - span * 0.42), z = a + Math.round(span) - 1;
  a = Math.max(0, a); z = Math.min(B.n - 1, z);
  if (z - a < 20) { a = Math.max(0, z - 20); }
  const cnt = z - a + 1, cw = (W - padL - padR) / cnt;
  let lo = Infinity, hi = -Infinity;
  for (let i = a; i <= z; i++) { lo = Math.min(lo, B.l[i]); hi = Math.max(hi, B.h[i]); }
  [t.sl, t.tp, t.entry, t.exit].forEach(v => { if (v) { lo = Math.min(lo, v); hi = Math.max(hi, v); } });
  const pv = (hi - lo) * 0.07 + 1; lo -= pv; hi += pv;
  const X = i => padL + (i - a + 0.5) * cw, Y = p => padT + (hi - p) / (hi - lo) * (H - padT - padB);
  const ink = css('--ink'), mute = css('--mute'), line = css('--line'), panel = css('--panel'), bull = css('--bull'), bear = css('--bear'),
        prof = css('--profit'), risk = css('--risk'), ema = css('--ema'), tag = css('--tag'), tagfg = css('--tagfg');
  c.font = '11px ' + css('--mono'); c.textBaseline = 'middle';

  // grid + price axis
  const rng = hi - lo, step = [5, 10, 20, 25, 50, 100, 200, 500].find(s => rng / s <= 7) || 500;
  c.strokeStyle = line; c.fillStyle = mute; c.lineWidth = 1; c.textAlign = 'left';
  for (let p = Math.ceil(lo / step) * step; p <= hi; p += step) { const y = Math.round(Y(p)) + 0.5; c.beginPath(); c.moveTo(padL, y); c.lineTo(W - padR, y); c.stroke(); c.fillText(p.toLocaleString('en-US'), W - padR + 6, y); }
  // time axis
  c.textAlign = 'center'; c.textBaseline = 'alphabetic'; let lastDay = '';
  const every = Math.max(1, Math.ceil(70 / cw / 6) * 6);
  for (let i = a; i <= z; i++) { const d = nyd.format(T(i)), isDay = d !== lastDay; lastDay = d;
    if (i % every === 0 || isDay) { c.fillStyle = mute; c.fillText(isDay ? d : nyt.format(T(i)), X(i), H - 8);
      c.strokeStyle = line; c.beginPath(); c.moveTo(Math.round(X(i)) + 0.5, H - padB); c.lineTo(Math.round(X(i)) + 0.5, H - padB + 4); c.stroke(); } }
  c.textBaseline = 'middle';

  // position box (entry bar to exit bar)
  const x0 = X(t.ei) - cw / 2, x1 = Math.max(X(t.xi) + cw / 2, x0 + 8), ptsWin = (t.exit - t.entry) * t.side > 0;
  const zone = (p, col, al) => { c.globalAlpha = al; c.fillStyle = col; c.fillRect(x0, Math.min(Y(t.entry), Y(p)), x1 - x0, Math.abs(Y(p) - Y(t.entry))); c.globalAlpha = 1; };
  if (t.tp) zone(t.tp, prof, 0.2); else if (ptsWin) zone(t.exit, prof, 0.2);
  if (t.sl) zone(t.sl, risk, 0.2); else if (!ptsWin) zone(t.exit, risk, 0.2);
  if (t.tp && !ptsWin) zone(t.exit, risk, 0.12);

  // supertrend highlighter fills (between line and ohlc4) and lines, broken at flips
  const widths = [1.4, 1.4, 1.4];
  for (let k = 0; k < 3; k++) {
    let runStart = a;
    for (let i = a; i <= z + 1; i++) {
      const brk = i > z || dirOf(i, k) !== dirOf(runStart, k) || B.line[k][i] === 0;
      if (brk) { const d = dirOf(runStart, k);
        if (i - 1 >= runStart && B.line[k][runStart] !== 0) {
          const col = d === 1 ? bull : bear;
          c.beginPath();
          for (let j = runStart; j < i; j++) { const y = Y(B.line[k][j]); j === runStart ? c.moveTo(X(j), y) : c.lineTo(X(j), y); }
          for (let j = i - 1; j >= runStart; j--) c.lineTo(X(j), Y((B.o[j] + B.h[j] + B.l[j] + B.c[j]) / 4));
          c.closePath(); c.globalAlpha = 0.09; c.fillStyle = col; c.fill(); c.globalAlpha = 1;
          c.beginPath(); for (let j = runStart; j < i; j++) { const y = Y(B.line[k][j]); j === runStart ? c.moveTo(X(j), y) : c.lineTo(X(j), y); }
          c.strokeStyle = col; c.lineWidth = widths[k]; c.stroke();
        }
        runStart = i; }
    }
  }
  // EMA
  c.strokeStyle = ema; c.lineWidth = 1.6; c.beginPath();
  for (let i = a; i <= z; i++) { const y = Y(B.e[i]); i === a ? c.moveTo(X(i), y) : c.lineTo(X(i), y); } c.stroke();

  // candles: hollow = up, solid = down
  const bw = Math.max(1, Math.min(cw * 0.7, 12));
  for (let i = a; i <= z; i++) {
    const o = B.o[i], h = B.h[i], l = B.l[i], cl = B.c[i], x = Math.round(X(i)) + 0.5;
    c.strokeStyle = ink; c.lineWidth = 1; c.beginPath(); c.moveTo(x, Y(h)); c.lineTo(x, Y(l)); c.stroke();
    const yo = Y(o), yc = Y(cl), top = Math.min(yo, yc), hh = Math.max(1, Math.abs(yc - yo));
    if (cl >= o) { c.fillStyle = panel; c.fillRect(X(i) - bw / 2, top, bw, hh); c.strokeRect(X(i) - bw / 2 + 0.5, top + 0.5, bw - 1, Math.max(0, hh - 1)); }
    else { c.fillStyle = ink; c.fillRect(X(i) - bw / 2, top, bw, hh); }
  }

  // Buy / Sell flag labels at every supertrend flip
  const flag = (x, y, up, text, col) => {
    c.font = '700 11px ' + css('--sans'); const w = c.measureText(text).width + 14, h = 18, by = up ? y + 8 : y - 8 - h;
    c.fillStyle = col; rrect(c, x - w / 2, by, w, h, 4); c.fill();
    c.beginPath(); if (up) { c.moveTo(x - 4, by); c.lineTo(x, by - 5); c.lineTo(x + 4, by); } else { c.moveTo(x - 4, by + h); c.lineTo(x, by + h + 5); c.lineTo(x + 4, by + h); } c.closePath(); c.fill();
    c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, x, by + h / 2 + 0.5);
  };
  for (let i = Math.max(a, 1); i <= z; i++) for (let k = 0; k < 3; k++) {
    const d = dirOf(i, k), p = dirOf(i - 1, k); if (d === 0 || p === 0 || d === p) continue;
    const off = k * 21;
    if (d === 1) flag(X(i), Y(B.l[i]) + off, true, 'Buy', bull); else flag(X(i), Y(B.h[i]) - off, false, 'Sell', bear);
  }

  // level lines + right tags
  const tagAt = (p, fill, fg) => { const y = Y(p); c.fillStyle = fill; c.fillRect(W - padR + 1, y - 8, padR - 2, 16); c.fillStyle = fg; c.font = '11px ' + css('--mono'); c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(p.toFixed(2), W - padR + 5, y + 0.5); };
  const hline = (p, col, dash, w) => { c.strokeStyle = col; c.lineWidth = w || 1.4; c.setLineDash(dash); c.beginPath(); c.moveTo(x0, Y(p)); c.lineTo(W - padR, Y(p)); c.stroke(); c.setLineDash([]); };
  if (t.tp) { hline(t.tp, prof, []); tagAt(t.tp, prof, '#fff'); }
  if (t.sl) { hline(t.sl, risk, []); tagAt(t.sl, risk, '#fff'); }
  hline(t.entry, ink, [5, 4], 1.2); tagAt(t.entry, tag, tagfg);

  // entry arrow + exit marker + result label
  c.fillStyle = t.side === 1 ? bull : bear; c.beginPath();
  const ex = X(t.ei), ey = Y(t.entry), dirY = t.side === 1 ? 1 : -1;
  c.moveTo(ex, ey + dirY * 4); c.lineTo(ex - 7, ey + dirY * 17); c.lineTo(ex + 7, ey + dirY * 17); c.closePath(); c.fill();
  const xc = t.pnl > 0 ? css('--win') : css('--loss'), xy = Y(t.exit);
  c.fillStyle = panel; c.strokeStyle = xc; c.lineWidth = 2; c.beginPath(); c.arc(X(t.xi), xy, 5, 0, 7); c.fill(); c.stroke();
  const risk$ = t.sl ? Math.abs(t.entry - t.sl) : 0, r = risk$ ? ((t.exit - t.entry) * t.side / risk$) : null;
  const lab = fmt$(t.pnl) + (r != null ? '  ' + (r >= 0 ? '+' : '') + r.toFixed(1) + 'R' : '');
  c.font = '500 12px ' + css('--mono'); c.fillStyle = xc; c.textBaseline = 'middle';
  const rightSide = X(t.xi) < W - padR - 130; c.textAlign = rightSide ? 'left' : 'right';
  c.fillText(lab, X(t.xi) + (rightSide ? 11 : -11), xy + ((t.exit - t.entry) * t.side >= 0 === (t.side === 1) ? -14 : 14));

  // crosshair (dashed, like the reference)
  if (hoverBar >= a && hoverBar <= z) {
    const hx = Math.round(X(hoverBar)) + 0.5, hy = draw.hy;
    c.strokeStyle = mute; c.lineWidth = 1; c.setLineDash([3, 4]);
    c.beginPath(); c.moveTo(hx, padT); c.lineTo(hx, H - padB); c.stroke();
    if (hy != null) { c.beginPath(); c.moveTo(padL, hy); c.lineTo(W - padR, hy); c.stroke(); } c.setLineDash([]);
    const s = nyf.format(T(hoverBar)); c.font = '500 11px ' + css('--mono'); const tw = c.measureText(s).width + 14;
    c.fillStyle = tag; rrect(c, Math.min(W - padR - tw, Math.max(padL, hx - tw / 2)), H - padB + 3, tw, 18, 4); c.fill();
    c.fillStyle = tagfg; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(s, Math.min(W - padR - tw / 2, Math.max(padL + tw / 2, hx)), H - padB + 12.5);
    if (hy != null) { const pr = hi - (hy - padT) / (H - padT - padB) * (hi - lo); c.fillStyle = tag; c.fillRect(W - padR + 1, hy - 8, padR - 2, 16); c.fillStyle = tagfg; c.textAlign = 'left'; c.fillText(pr.toFixed(2), W - padR + 5, hy + 0.5); }
  }

}
function hoverTxt(i) { return `${nyf.format(T(i))}   O ${B.o[i].toFixed(2)}   H ${B.h[i].toFixed(2)}   L ${B.l[i].toFixed(2)}   C ${B.c[i].toFixed(2)}   ST ${[0, 1, 2].map(k => dirOf(i, k) === 1 ? '▲' : '▼').join('')}`; }
$('chart').addEventListener('mousemove', e => {
  const g = draw.geo; if (!g) return; const r = e.currentTarget.getBoundingClientRect();
  const i = g.a + Math.floor((e.clientX - r.left - g.padL) / g.cw);
  if (i < g.a || i > g.z) { hoverBar = -1; draw.hy = null; $('hover').textContent = 'Move over the chart to read each candle.'; draw(); return; }
  hoverBar = i; draw.hy = e.clientY - r.top; $('hover').textContent = hoverTxt(i); draw();
});
$('chart').addEventListener('mouseleave', () => { hoverBar = -1; draw.hy = null; $('hover').textContent = 'Move over the chart to read each candle.'; draw(); });

/* ---------- equity curve ---------- */
function drawEq() {
  const [c, W, H] = setup($('eqc')); const all = S[sIdx].trades, t = filtered[cur]; if (!t || !all.length) return;
  const lo = Math.min(META.capital, ...all.map(x => x.bal)), hi = Math.max(META.capital, ...all.map(x => x.bal));
  const X = i => 2 + i / Math.max(1, all.length - 1) * (W - 4), Y = v => 4 + (hi - v) / Math.max(1, hi - lo) * (H - 8);
  const line = css('--line'), mute = css('--mute'), ink = css('--ink'), bull = css('--bull'), prof = css('--profit');
  const ts = all.findIndex(x => x.test);
  if (ts > 0) { c.globalAlpha = 0.12; c.fillStyle = prof; c.fillRect(X(ts), 0, W - X(ts), H); c.globalAlpha = 1; c.fillStyle = mute; c.font = '11px ' + css('--mono'); c.textAlign = 'left'; c.textBaseline = 'top'; c.fillText('test period', X(ts) + 4, H - 14); }
  c.strokeStyle = line; c.lineWidth = 1; c.beginPath(); c.moveTo(0, Y(META.capital) + 0.5); c.lineTo(W, Y(META.capital) + 0.5); c.stroke();
  c.strokeStyle = ink; c.lineWidth = 1.25; c.beginPath(); all.forEach((x, i) => { i ? c.lineTo(X(i), Y(x.bal)) : c.moveTo(X(i), Y(x.bal)); }); c.stroke();
  const i = t.id - 1; c.strokeStyle = bull; c.lineWidth = 1.5; c.beginPath(); c.moveTo(X(i), 0); c.lineTo(X(i), H); c.stroke();
  c.fillStyle = bull; c.beginPath(); c.arc(X(i), Y(t.bal), 4, 0, 7); c.fill();
  c.font = '11px ' + css('--mono'); c.fillStyle = mute; c.textBaseline = 'top'; c.textAlign = 'right'; c.fillText(fmtBal(hi), W - 4, 2); c.textAlign = 'left'; c.textBaseline = 'bottom'; c.fillText(fmtBal(lo), 4, H - 2);
  $('eqnote').textContent = `Trade #${t.id}: ${fmtBal(t.bal)}`;
}
$('eqc').addEventListener('click', e => {
  const r = e.currentTarget.getBoundingClientRect(), n = S[sIdx].trades.length;
  const id = Math.round((e.clientX - r.left - 2) / (r.width - 4) * (n - 1)) + 1; const i = filtered.findIndex(t => t.id >= id); go(i < 0 ? filtered.length - 1 : i);
});

/* ---------- wiring ---------- */
$('strats').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; sIdx = +b.dataset.k; renderStrats(); $('eqcap').textContent = eqCap(); refilter(); });
$('chips').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.p) { periodKey = b.dataset.p; refilter(); } else if (b.dataset.k) { fkey = b.dataset.k; refilter(filtered[cur] && filtered[cur].id); } });
$('rows').addEventListener('click', e => { const r = e.target.closest('.row'); if (r) go(+r.dataset.i); });
$('rows').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset.i) { e.preventDefault(); go(+e.target.dataset.i); } });
$('prev').onclick = $('tprev').onclick = () => go(cur - 1); $('next').onclick = $('tnext').onclick = () => go(cur + 1);
$('first').onclick = () => go(0); $('last').onclick = () => go(filtered.length - 1); $('rand').onclick = () => go(Math.floor(Math.random() * filtered.length));
$('zin').onclick = () => { span = Math.max(24, span * 0.7); draw(); }; $('zout').onclick = () => { span = Math.min(B.n, span * 1.4); draw(); }; $('zrst').onclick = () => { span = spanBase; draw(); };
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('.rows') && e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur - 1); } else if (e.key === 'ArrowRight') { e.preventDefault(); go(cur + 1); }
  else if (e.key === 'Home') { e.preventDefault(); go(0); } else if (e.key === 'End') { e.preventDefault(); go(filtered.length - 1); }
});
const redraw = () => { if (B) { draw(); drawEq(); } };
new ResizeObserver(redraw).observe($('chart')); new ResizeObserver(redraw).observe($('eqc'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redraw);
new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
const eqCap = () => `Account balance after each trade, starting at ${fmtBal(META.capital)} (shaded = test period, never used to pick the rules). Click to jump to a trade.`;

(async () => {
  $('sub').textContent = META.sub; $('note').textContent = META.note;
  $('legend').innerHTML = `<span><i style="background:var(--bull)"></i>Supertrend up / Buy</span><span><i style="background:var(--bear)"></i>Supertrend down / Sell</span>
    <span><i style="background:var(--profit)"></i>Profit zone / target</span><span><i style="background:var(--risk)"></i>Stop zone</span><span><i style="background:var(--ema)"></i>50 EMA</span>`;
  try { await decode(); } catch (err) { document.querySelector('.main').innerHTML = '<p class="msg">This page needs a current browser (it unpacks its data with DecompressionStream).</p>'; return; }
  sIdx = META.defaultStrat || 0; renderStrats(); $('eqcap').textContent = eqCap(); renderStats(); refilter();
  cur = Math.min(filtered.length - 1, 12); resetSpan(); update();
})();
</script>
